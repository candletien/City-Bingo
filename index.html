<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b4a">
  <title>City Bingo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Setup screen -->
  <main id="setup" class="screen">
    <header class="hero">
      <div class="logo">🧳</div>
      <h1>City Bingo</h1>
      <p>เกมบิงโกสำหรับนักเดินทาง ทำภารกิจให้ครบแถวระหว่างเที่ยว!</p>
    </header>

    <form id="setup-form" class="card">
      <label class="field">
        <span>ชื่อผู้เล่น</span>
        <input id="player" type="text" maxlength="24" placeholder="เช่น นักเที่ยวสายกิน" required>
      </label>

      <fieldset class="field">
        <legend>เลือกเมือง</legend>
        <div id="city-list" class="city-list"></div>
      </fieldset>

      <fieldset class="field">
        <legend>ขนาดการ์ด</legend>
        <div class="seg">
          <label><input type="radio" name="size" value="3"><span>3×3<small>สั้น ๆ 1 วัน</small></span></label>
          <label><input type="radio" name="size" value="4" checked><span>4×4<small>ทริปสั้น</small></span></label>
          <label><input type="radio" name="size" value="5"><span>5×5<small>ทริปยาว</small></span></label>
        </div>
      </fieldset>

      <details class="field custom">
        <summary>✏️ เพิ่มภารกิจของตัวเอง (ไม่บังคับ)</summary>
        <textarea id="custom" rows="4" placeholder="พิมพ์ 1 ภารกิจต่อบรรทัด เช่น&#10;กินก๋วยเตี๋ยวเรือ&#10;ถ่ายรูปกับตุ๊กตุ๊ก"></textarea>
      </details>

      <button class="btn primary" type="submit">เริ่มเกม 🎲</button>
    </form>
  </main>

  <!-- Game screen -->
  <main id="game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-home" class="icon-btn" aria-label="กลับหน้าแรก">←</button>
      <div class="title">
        <h2 id="game-title"></h2>
        <p id="game-sub"></p>
      </div>
      <button id="btn-menu" class="icon-btn" aria-label="เมนู">⋯</button>
    </header>

    <section class="stats">
      <div><b id="stat-done">0</b><span>ภารกิจ</span></div>
      <div><b id="stat-lines">0</b><span>บิงโก</span></div>
      <div><b id="stat-score">0</b><span>คะแนน</span></div>
    </section>
    <div class="progress"><div id="progress-bar"></div></div>

    <section id="board" class="board" aria-label="บิงโกการ์ด"></section>

    <p class="hint">แตะช่องเพื่อดูภารกิจและติ๊กว่าทำแล้ว · ครบแถวตั้ง แนวนอน หรือแนวทแยง = บิงโก!</p>

    <div class="actions">
      <button id="btn-share" class="btn">📤 แชร์ผล</button>
      <button id="btn-album" class="btn">🖼️ อัลบั้ม</button>
    </div>
  </main>

  <!-- Cell dialog -->
  <dialog id="cell-dialog" class="sheet">
    <form method="dialog" class="sheet-body">
      <div class="sheet-emoji" id="cd-emoji"></div>
      <h3 id="cd-title"></h3>
      <p id="cd-detail"></p>

      <div id="cd-photo-wrap" class="photo-wrap">
        <img id="cd-photo" alt="" hidden>
        <label class="btn small">📷 แนบรูป<input id="cd-file" type="file" accept="image/*" hidden></label>
        <button id="cd-photo-remove" type="button" class="btn small ghost" hidden>ลบรูป</button>
      </div>

      <label class="field">
        <span>บันทึก</span>
        <input id="cd-note" type="text" maxlength="80" placeholder="ที่ไหน กับใคร รู้สึกยังไง">
      </label>

      <div class="row">
        <button value="cancel" class="btn ghost">ปิด</button>
        <button id="cd-toggle" value="toggle" class="btn primary"></button>
      </div>
    </form>
  </dialog>

  <!-- Menu dialog -->
  <dialog id="menu-dialog" class="sheet">
    <form method="dialog" class="sheet-body">
      <h3>เมนู</h3>
      <button value="shuffle" class="btn block">🔀 สุ่มการ์ดใหม่ (ล้างความคืบหน้า)</button>
      <button value="reset" class="btn block">↺ ล้างเครื่องหมายทั้งหมด</button>
      <button value="new" class="btn block">🏙️ เปลี่ยนเมือง / เริ่มใหม่</button>
      <button value="cancel" class="btn ghost block">ปิด</button>
    </form>
  </dialog>

  <!-- Album dialog -->
  <dialog id="album-dialog" class="sheet">
    <form method="dialog" class="sheet-body">
      <h3>อัลบั้มทริป</h3>
      <div id="album" class="album"></div>
      <button value="cancel" class="btn ghost block">ปิด</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
